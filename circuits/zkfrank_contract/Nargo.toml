[package]
name = "zkfrank_contract"
type = "contract"
authors = [""]

[dependencies]
aztec = { git="https://github.com/AztecProtocol/aztec-nr", tag="v4.3.0", directory="aztec" }
# sha256 is not part of the Noir stdlib. ECDSA signs a digest, and
# verify_signature does no hashing of its own, so the circuit has to produce it.
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
